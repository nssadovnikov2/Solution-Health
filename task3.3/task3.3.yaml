openapi: 3.2.0
info:
  title: API мобильного приложения "Здоровье+"
  version: 1.0.0
  description: API для записи к врачу, оплаты и получения результатов

servers:
  - url: https://api.zdorovieplus.ru/api/v1
    description: Production API

paths:
  /appointments:
    get:
      summary: Получение списка записей пациента
      description: Возвращает список записей к врачу с возможностью фильтрации по статусу и пагинацией.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу записи
          required: false
          schema:
            type: string
            enum:
              - upcoming
              - completed
              - cancelled
              - all
            default: upcoming
        - name: limit
          in: query
          description: Максимальное количество записей в ответе
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Смещение для пагинации (количество пропущенных записей)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Успешный ответ с массивом записей
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Общее количество записей по фильтру
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
              example:
                total: 12
                limit: 20
                offset: 0
                items:
                  - id: "a1b2c3d4"
                    doctor_name: "Иванова Анна Петровна"
                    specialty: "Терапевт"
                    clinic_name: "Клиника на Тверской"
                    address: "г. Москва, ул. Тверская, д. 10"
                    date_time: "2025-08-20T10:30:00+03:00"
                    status: "confirmed"
                    status_display: "Подтверждена"
                    payment_status: "paid"
        '401':
          description: Ошибка аутентификации (невалидный или отсутствующий JWT-токен)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "UNAUTHORIZED"
                message: "Токен недействителен или истёк"
                trace_id: "trace-12345"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "INTERNAL_SERVER_ERROR"
                message: "Произошла ошибка на сервере. Попробуйте позже."
                trace_id: "trace-67890"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор записи (UUID)
        doctor_name:
          type: string
          description: ФИО врача
        specialty:
          type: string
          description: Специализация врача
        clinic_name:
          type: string
          description: Название клиники
        address:
          type: string
          description: Адрес клиники
        date_time:
          type: string
          format: date-time
          description: Дата и время записи (ISO 8601)
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
          description: Технический статус записи
        status_display:
          type: string
          description: Человекочитаемый статус для отображения в UI
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
          description: Статус оплаты
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        trace_id:
          type: string
          description: Идентификатор запроса для связи с логами



Пояснение к выбранным подходам
Версионирование API (URL-версионирование): Выбран подход с версией в URL (/api/v1/...). Это наиболее явный и простой способ для мобильных приложений, так как клиент (приложение) всегда знает, какую версию вызывает. При изменении контракта создаётся новая версия (/api/v2/...), а старая поддерживается для старых версий приложения (обратная совместимость).

Пагинация (limit + offset): Выбран классический подход с limit и offset. Он прост в реализации и понятен клиентам. Для мобильного приложения с вертикальным скроллингом этого достаточно. В будущем, при необходимости, можно добавить cursor-based пагинацию для повышения производительности на больших объёмах данных.
          
